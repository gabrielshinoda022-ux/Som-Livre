
name: Gerar APK Som Livre

on:
  workflow_dispatch:
  push:
    paths:
      - 'SomLivre-projeto.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip SomLivre-projeto.zip

      - name: Compilar APK
        run: gradle -p SomLivre assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SomLivre-APK
          path: SomLivre/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
